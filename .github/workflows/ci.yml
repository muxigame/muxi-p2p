name: ci

# The umbrella builds the pinned agent and signaling commits together, so a bump of either
# submodule is checked against the other.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  agent:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"
      - shell: bash
        run: |
          set -eu
          for project in agent/src/*/*.csproj; do dotnet build "$project" -c Release; done

  signaling:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - working-directory: signaling
        run: |
          pip install -r requirements-dev.txt
          pip install --no-deps .
          python -B -m unittest discover -s tests -v
